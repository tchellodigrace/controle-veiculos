<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="https://i.ibb.co/PZStmN7z/logo-sem-fundo-arcatech.png">
<title>Painel de Logistica</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:'Segoe UI',system-ui,-apple-system,sans-serif; background:#f0f2f5; min-height:100vh; }
  .topbar{
    background:linear-gradient(135deg,#1a1a2e 0%,#2a2a4a 100%);
    color:#fff; padding:12px 24px;
    display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
  }
  .topbar h1{ font-size:16px; font-weight:700; display:flex; align-items:center; gap:8px; }
  .topbar h1 svg{ width:22px; height:22px; }
  .topbar .empresa{ font-size:13px; opacity:.8; font-weight:400; }
  .topbar .status{ font-size:11px; display:flex; align-items:center; gap:6px; }
  .status-dot{ width:8px; height:8px; border-radius:50%; background:#28a745; animation:pulsar 2s ease-in-out infinite; }
  @keyframes pulsar{ 0%,100%{ opacity:1; transform:scale(1); } 50%{ opacity:.4; transform:scale(1.4); } }

  .container{ padding:16px; max-width:1400px; margin:0 auto; }
  .grid{ display:grid; grid-template-columns:1fr 340px; gap:16px; }

  .card{
    background:#fff; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.06);
    overflow:hidden;
  }
  .card-header{
    padding:14px 16px; border-bottom:1px solid #e8ebed;
    display:flex; align-items:center; justify-content:space-between;
  }
  .card-header h3{ font-size:14px; color:#1a1a2e; font-weight:700; display:flex; align-items:center; gap:8px; }
  .card-header .count{ font-size:12px; color:#6b7685; }

  #mapaContainer{ width:100%; height:500px; background:#e8e8e8; }
  .mapa-vazio{
    position:absolute; top:0; left:0; right:0; bottom:0;
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px;
    color:#9aa4ad; font-size:14px; z-index:1000; background:#f7f8fa;
  }
  .mapa-vazio svg{ width:48px; height:48px; opacity:.3; }

  /* Lista lateral */
  .lista-section{ display:flex; flex-direction:column; gap:12px; max-height:700px; overflow-y:auto; padding:12px; }
  .motorista-card{
    background:#f7f9fb; border:1px solid #e0e3e7; border-radius:10px;
    padding:12px; cursor:pointer; transition:.15s;
  }
  .motorista-card:hover{ background:#eef3f7; border-color:#4FB0C6; transform:translateY(-1px); box-shadow:0 2px 8px rgba(0,0,0,.08); }
  .motorista-card .mc-topo{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .motorista-card .mc-cor{ width:14px; height:14px; border-radius:50%; flex-shrink:0; border:2px solid #fff; box-shadow:0 1px 3px rgba(0,0,0,.2); }
  .motorista-card .mc-nome{ font-weight:700; color:#1a1a2e; font-size:13px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .motorista-card .mc-info{ font-size:11px; color:#6b7685; display:flex; flex-direction:column; gap:2px; }
  .motorista-card .mc-rua{ color:#4a5568; }
  .motorista-card .mc-tempo{ color:#9aa4ad; font-size:10px; margin-top:4px; }
  .motorista-card.chegou-card{ background:#e8f0fe; border-color:#2196F3; }
  .motorista-card.no-patio{ background:#fff3e0; border-color:#ff9800; }
  .motorista-card.concluido-card{ background:#e8f5e9; border-color:#4caf50; opacity:.85; }
  .motorista-card.concluido-card:hover{ opacity:1; }

  /* Badge de status */
  .status-badge{ font-size:10px; color:#fff; padding:2px 8px; border-radius:10px; font-weight:700; white-space:nowrap; }
  .status-badge.a-caminho{ background:#ff9800; }
  .status-badge.chegou{ background:#2196F3; }
  .status-badge.concluido{ background:#4caf50; }
  .status-badge.no-patio{ background:#ff9800; }

  /* Botoes de acao */
  .mc-acoes{ display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .mc-acoes button{
    flex:1 1 0; min-width:0; padding:7px 10px; border:none; border-radius:8px; font-size:10px;
    font-weight:700; cursor:pointer; transition:.15s; display:flex;
    align-items:center; justify-content:center; gap:4px; white-space:normal; line-height:1.2;
  }
  .btn-entrega-concluida{
    background:#4caf50; color:#fff;
  }
  .btn-entrega-concluida:hover{ background:#43a047; transform:translateY(-1px); box-shadow:0 2px 6px rgba(0,0,0,.15); }
  .btn-entrega-concluida:disabled{ background:#a5d6a7; cursor:not-allowed; transform:none; box-shadow:none; }
  /* Botao Finalizado */
  .btn-finalizado{
    background:#4caf50; color:#fff; font-size:10px; padding:7px 10px;
    border:none; border-radius:8px; cursor:pointer; font-weight:700;
    transition:.15s; flex:1 1 0; min-width:0; display:flex;
    align-items:center; justify-content:center; gap:4px; white-space:normal; line-height:1.2;
  }
  .btn-finalizado:hover{ background:#43a047; transform:translateY(-1px); box-shadow:0 2px 6px rgba(0,0,0,.15); }

  /* Informacoes adicionais */
  .mc-adicionais{
    margin-top:6px; padding:8px 10px; background:#f0f4f8; border-radius:8px;
    font-size:11px; color:#4a5568; display:flex; flex-direction:column; gap:2px;
  }
  .mc-adicionais b{ color:#1a1a2e; }
  .btn-imprimir{
    background:#607d8b; color:#fff; font-size:10px; padding:7px 10px;
    border:none; border-radius:8px; cursor:pointer; font-weight:700;
    transition:.15s; flex:0 0 auto; min-width:auto;
  }
  .btn-imprimir:hover{ background:#455a64; transform:translateY(-1px); box-shadow:0 2px 6px rgba(0,0,0,.15); }

  /* Barra de acoes fixa */
  .acoes-barra{
    background:#fff; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.06);
    padding:14px 16px; margin-top:16px; display:flex; gap:10px; flex-wrap:wrap;
  }
  .acoes-barra button{
    flex:1; min-width:180px; padding:12px 16px; border:none; border-radius:10px;
    font-size:13px; font-weight:700; cursor:pointer; transition:.15s;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn-barra-entrega{ background:#4caf50; color:#fff; }
  .btn-barra-entrega:hover{ background:#43a047; }
  .btn-barra-patio{ background:#ff9800; color:#fff; }
  .btn-barra-patio:hover{ background:#fb8c00; }

  /* Botao liberar portaria */
  .btn-liberar-portaria{
    padding:7px 10px; border:none; border-radius:8px; font-size:10px;
    font-weight:700; cursor:pointer; transition:.15s;
    display:flex; align-items:center; justify-content:center; gap:4px;
    background:linear-gradient(135deg,#1565c0,#1976d2); color:#fff;
    white-space:normal; line-height:1.2;
  }
  .btn-liberar-portaria:hover{ background:linear-gradient(135deg,#0d47a1,#1565c0); transform:translateY(-1px); box-shadow:0 2px 6px rgba(0,0,0,.15); }
  .btn-liberar-portaria:disabled{ opacity:.5; cursor:not-allowed; transform:none; box-shadow:none; }

  /* Botao Patio Liberado (laranja) */
  .btn-patio-liberado{
    padding:7px 10px; border:none; border-radius:8px; font-size:10px;
    font-weight:700; cursor:pointer; transition:.15s;
    display:flex; align-items:center; justify-content:center; gap:4px;
    background:linear-gradient(135deg,#e65100,#ff9800); color:#fff;
    white-space:normal; line-height:1.2;
  }
  .btn-patio-liberado:hover{ background:linear-gradient(135deg,#bf360c,#e65100); transform:translateY(-1px); box-shadow:0 2px 6px rgba(0,0,0,.15); }
  .btn-patio-liberado:disabled{ opacity:.5; cursor:not-allowed; transform:none; box-shadow:none; }

  /* Pre-registros */
  .pr-card{
    background:#fffbe6; border:1px solid #ffe082; border-radius:10px;
    padding:10px 12px; font-size:12px;
  }
  .pr-card .pr-topo{ display:flex; align-items:center; gap:6px; margin-bottom:4px; }
  .pr-card .pr-motorista{ font-weight:700; color:#1a1a2e; font-size:12px; }
  .pr-card .pr-info{ color:#6b7685; line-height:1.6; }
  .pr-card .pr-info b{ color:#4a5568; }

  /* Separador de secao */
  .separador{ text-align:center; font-size:11px; color:#9aa4ad; padding:6px 0 2px; border-top:1px dashed #ddd; margin-top:4px; }

  /* Check-ins QR */
  .checkin-card{
    background:#e8f5e9; border:1px solid #a5d6a7; border-radius:10px;
    padding:10px 12px; cursor:pointer; transition:.15s;
  }
  .checkin-card:hover{ background:#c8e6c9; transform:translateY(-1px); box-shadow:0 2px 8px rgba(0,0,0,.08); }
  .checkin-card .cc-topo{ display:flex; align-items:center; gap:6px; margin-bottom:4px; }
  .checkin-card .cc-motorista{ font-weight:700; color:#1a1a2e; font-size:12px; flex:1; }
  .checkin-card .cc-info{ font-size:11px; color:#6b7685; display:flex; flex-direction:column; gap:2px; }
  .checkin-card .cc-info b{ color:#4a5568; }
  .cc-status{ font-size:10px; padding:2px 8px; border-radius:10px; font-weight:700; white-space:nowrap; }
  .cc-status.em_transito{ background:#fff3e0; color:#e08a1e; }
  .cc-status.aguardando{ background:#e3f2fd; color:#1565c0; }
  .cc-status.confirmado{ background:#e8f5e9; color:#1b7d2c; }
  .cc-tipo{ font-size:10px; color:#6b7685; margin-left:auto; }

  /* Modal */
  .modal-overlay{ display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.5); z-index:9999; align-items:center; justify-content:center; }
  .modal-overlay.mostrar{ display:flex; }
  .modal-box{ background:#fff; border-radius:14px; max-width:520px; width:95%; max-height:85vh; overflow-y:auto; box-shadow:0 8px 32px rgba(0,0,0,.2); animation:modalIn .2s ease-out; }
  @keyframes modalIn{ from{ opacity:0; transform:scale(.95) translateY(10px); } to{ opacity:1; transform:scale(1) translateY(0); } }
  .modal-top{ padding:16px 20px; border-bottom:1px solid #e8ebed; display:flex; align-items:center; justify-content:space-between; }
  .modal-top h2{ font-size:16px; font-weight:700; color:#1a1a2e; display:flex; align-items:center; gap:8px; }
  .modal-fechar{ background:none; border:1px solid #e0e3e7; border-radius:8px; width:32px; height:32px; font-size:18px; cursor:pointer; color:#6b7685; display:flex; align-items:center; justify-content:center; }
  .modal-fechar:hover{ background:#fdecea; color:#dc3545; border-color:#dc3545; }
  .modal-body{ padding:20px 24px; }
  .modal-linha{ display:flex; padding:10px 0; border-bottom:1px solid #f0f2f5; gap:12px; }
  .modal-linha:last-child{ border-bottom:none; }
  .modal-label{ font-size:12px; color:#9aa4ad; min-width:110px; font-weight:600; }
  .modal-valor{ color:#1a1a2e; flex:1; word-break:break-word; font-size:13px; }

  /* Leaflet */
  .leaflet-popup-content{ font-size:13px; line-height:1.5; }
  .leaflet-popup-content b{ color:#1a1a2e; }

  /* Responsivo */
  @media(max-width:900px){
    .grid{ grid-template-columns:1fr; }
    #mapaContainer{ height:350px; }
    .lista-section{ max-height:300px; }
  }
  @media(max-width:500px){
    .topbar{ padding:10px 14px; flex-direction:column; gap:4px; text-align:center; }
    .container{ padding:10px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h1>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
      Painel de Logistica
    </h1>
    <div class="empresa" id="nomeEmpresa">---</div>
  </div>
  <div class="status">
    <div class="status-dot"></div>
    <span>Tempo real</span>
  </div>
</div>

<div class="container">
  <div class="grid">
    <!-- Mapa -->
    <div class="card">
      <div class="card-header">
        <h3>&#x1F4CD; Rastreamento ao Vivo</h3>
        <span class="count" id="motoristaCount">0 motoristas</span>
      </div>
      <div style="position:relative">
        <div id="mapaContainer"></div>
        <div class="mapa-vazio" id="mapaVazio">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
          Nenhum motorista no momento
        </div>
      </div>
    </div>

    <!-- Lista lateral -->
    <div class="card">
      <div class="card-header">
        <h3>&#x1F4E6; Entregas e Coletas</h3>
      </div>
      <!-- Mensagem fixa: veiculos aguardando liberacao / a caminho do patio -->
      <div id="msgAguardandoPatio" style="display:none;background:linear-gradient(135deg,#e3f2fd,#bbdefb);border:2px solid #2196F3;border-radius:10px;padding:14px 16px;margin:12px 12px 0 12px;font-size:13px;color:#0d47a1;">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <span style="font-size:18px">&#x23F3;</span>
          <b style="font-size:14px;color:#0d47a1">Aguardando liberacao do patio</b>
        </div>
        <div id="msgAguardandoPatioDetalhes" style="color:#1565c0;line-height:1.5"></div>
        <div id="msgAguardandoPatioBotoes" style="margin-top:10px;display:flex;flex-wrap:wrap;gap:8px"></div>
      </div>
      <!-- Mensagem: veiculos no patio aguardando finalizacao -->
      <div id="msgVeiculoNoPatio" style="display:none;background:linear-gradient(135deg,#fff3e0,#ffe0b2);border:2px solid #ff9800;border-radius:10px;padding:14px 16px;margin:12px 12px 0 12px;font-size:13px;color:#e65100;">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <span style="font-size:18px">&#x1F6E4;&#xFE0F;</span>
          <b style="font-size:14px;color:#e65100">Veiculo no Patio</b>
        </div>
        <div id="msgVeiculoNoPatioDetalhes" style="color:#bf360c;line-height:1.5"></div>
        <div id="msgVeiculoNoPatioBotoes" style="margin-top:10px;display:flex;flex-wrap:wrap;gap:8px"></div>
      </div>
      <div class="lista-section" id="listaContainer">
        <div style="text-align:center;color:#9aa4ad;font-size:13px;padding:20px">Carregando...</div>
      </div>
    </div>
  </div>
</div>

<!-- Modal de detalhes check-in QR -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-top">
      <h2>📋 Detalhes do Check-in</h2>
      <button class="modal-fechar" onclick="fecharModal()">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="toast-container-log" id="toastContainerLog" style="position:fixed;top:16px;right:16px;z-index:10000;display:flex;flex-direction:column;gap:10px;max-width:380px"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var API = window.location.origin;
var params = new URLSearchParams(window.location.search);
var TOKEN = params.get('token');
var CLIENTE_ID = params.get('cliente_id');
var EMPRESA = params.get('empresa') || '---';
var checkinsCache = [];

if(!TOKEN || !CLIENTE_ID){
  document.querySelector('.container').innerHTML = '<div style="text-align:center;padding:60px"><h2 style="color:#cc0000">Link invalido</h2><p style="color:#666;margin-top:8px">Este link expirou ou foi desativado.</p></div>';
}

document.getElementById('nomeEmpresa').textContent = EMPRESA;

// === MAPA ===
var mapa = null;
var marcadores = [];
var mapaIniciado = false;

function iniciarMapa(){
  if(mapaIniciado){ setTimeout(function(){ if(mapa) mapa.invalidateSize(); }, 100); return; }
  mapaIniciado = true;
  mapa = L.map('mapaContainer', { zoomControl: true }).setView([-15.78, -47.93], 5);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 19
  }).addTo(mapa);
  setTimeout(function(){ mapa.invalidateSize(); }, 200);
}

var cores = ['#28a745','#2196F3','#ff5722','#9c27b0','#ff9800','#00bcd4','#e91e63','#795548','#607d8b','#3f51b5'];

function getStatusInfo(d){
  if(d.saida_logistica){
    var tipo = (d.finalidade_tipo || '').toLowerCase();
    var tipoLabel = 'Finalizado';
    if(tipo.indexOf('coleta') >= 0) tipoLabel = 'Coleta Finalizada';
    else if(tipo.indexOf('entrega') >= 0) tipoLabel = 'Entrega Finalizada';
    else if(tipo.indexOf('retorno') >= 0) tipoLabel = 'Retorno Finalizado';
    else tipoLabel = 'Finalizado';
    return { label: tipoLabel, css: 'concluido', badge: 'concluido', cor: '#9e9e9e' };
  }
  if(d.chegou && d.patio_liberado){
    return { label: 'Patio Finalizado', css: 'concluido', badge: 'concluido', cor: '#4caf50' };
  }
  if(d.chegou && d.veiculo_no_patio && !d.patio_liberado){
    return { label: 'Veiculo no Patio', css: 'no-patio', badge: 'no-patio', cor: '#ff9800' };
  }
  if(d.chegou && d.registro_id && !d.veiculo_no_patio){
    return { label: 'Aguardando liberacao do patio', css: 'chegou', badge: 'chegou', cor: '#2196F3', emoji: true };
  }
  if(d.chegou){
    return { label: 'No local', css: 'chegou', badge: 'chegou', cor: '#ff9800' };
  }
  return { label: 'A caminho', css: '', badge: 'a-caminho', cor: '#ff9800' };
}

function carregarDados(){
  if(!TOKEN) return;
  fetch(API + '/api/logistica/' + encodeURIComponent(TOKEN))
    .then(function(res){
      if(!res.ok){
        document.getElementById('listaContainer').innerHTML = '<div style="text-align:center;color:#cc0000;font-size:13px;padding:20px">Erro ao carregar dados (HTTP ' + res.status + '). Verifique o link ou recarregue a pagina.</div>';
        return null;
      }
      return res.json();
    })
    .then(function(data){
      if(!data || data.erro) return;
      var motoristas = data.motoristas || [];
      var preRegistros = data.preRegistros || [];
      var checkinsQR = data.checkinsQR || [];
      checkinsCache = checkinsQR;

      // Contadores
      var aCaminhoCount = 0, chegouCount = 0, concluidoCount = 0;
      motoristas.forEach(function(d){
        if(d.saida_logistica) concluidoCount++;
        else if(d.chegou) chegouCount++;
        else if(d.a_caminho) aCaminhoCount++;
      });

      var countParts = [];
      if(aCaminhoCount > 0) countParts.push(aCaminhoCount + ' a caminho');
      if(chegouCount > 0) countParts.push(chegouCount + ' chegou');
      if(concluidoCount > 0) countParts.push(concluidoCount + ' concluido');
      document.getElementById('motoristaCount').textContent = countParts.length > 0 ? countParts.join(', ') : '0 motoristas';

      // === Mensagem fixa: veiculos aguardando liberacao do patio ===
      var aguardando = motoristas.filter(function(d){ return d.registro_id && d.chegou && !d.saida_logistica && !d.veiculo_no_patio; });
      var msgEl = document.getElementById('msgAguardandoPatio');
      var msgDetalhes = document.getElementById('msgAguardandoPatioDetalhes');
      var msgBotoes = document.getElementById('msgAguardandoPatioBotoes');
      if(aguardando.length > 0){
        msgDetalhes.innerHTML = '<div>' +
          aguardando.map(function(d){ return '&bull; ' + (d.nome || 'Motorista') + ' - ' + (d.placa || 'Sem placa') + (d.empresa ? ' (' + d.empresa + ')' : ''); }).join('<br>') + '</div>';
        msgBotoes.innerHTML = aguardando.map(function(d){
          var placaJS = d.placa ? ('\'' + String(d.placa).replace(/\\/g, '\\\\').replace(/'/g, "\\'") + '\'') : 'null';
          return '<button style="background:linear-gradient(135deg,#e65100,#ff9800);color:#fff;border:none;border-radius:10px;padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;transition:.15s" onmouseover="this.style.transform=\'translateY(-1px)\'" onmouseout="this.style.transform=\'none\'" onclick="event.stopPropagation(); patioLiberado(' + placaJS + ')">&#x1F6E4;&#xFE0F; Patio Liberado - ' + esc(d.placa || '') + '</button>';
        }).join('');
        msgEl.style.display = 'block';
      } else {
        msgEl.style.display = 'none';
      }

      // === Mensagem: veiculos no patio aguardando finalizacao ===
      var noPatio = motoristas.filter(function(d){ return d.registro_id && d.chegou && !d.saida_logistica && d.veiculo_no_patio && !d.patio_liberado; });
      var msgPatioEl = document.getElementById('msgVeiculoNoPatio');
      var msgPatioDetalhes = document.getElementById('msgVeiculoNoPatioDetalhes');
      var msgPatioBotoes = document.getElementById('msgVeiculoNoPatioBotoes');
      if(noPatio.length > 0){
        msgPatioDetalhes.innerHTML = '<div>' +
          noPatio.map(function(d){ return '&bull; ' + (d.nome || 'Motorista') + ' - ' + (d.placa || 'Sem placa') + (d.empresa ? ' (' + d.empresa + ')' : ''); }).join('<br>') + '</div>';
        msgPatioBotoes.innerHTML = noPatio.map(function(d){
          var placaJS = d.placa ? ('\'' + String(d.placa).replace(/\\/g, '\\\\').replace(/'/g, "\\'") + '\'') : 'null';
          return '<button style="background:#4caf50;color:#fff;border:none;border-radius:10px;padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;transition:.15s" onmouseover="this.style.transform=\'translateY(-1px)\'" onmouseout="this.style.transform=\'none\'" onclick="event.stopPropagation(); finalizarVeiculo(' + placaJS + ')">&#x2705; Finalizado - ' + esc(d.placa || '') + '</button>';
        }).join('');
        msgPatioEl.style.display = 'block';
      } else {
        msgPatioEl.style.display = 'none';
      }

      var vazioEl = document.getElementById('mapaVazio');
      if(motoristas.length > 0){ vazioEl.style.display = 'none'; } else { vazioEl.style.display = 'flex'; }

      // === REORDENAR: motoristas com acao pendente primeiro (registro_id + chegou), depois a_caminho ===
      var motoristasOrdenados = motoristas.slice().sort(function(a, b){
        // Finalizados por ultimo
        if(a.saida_logistica && !b.saida_logistica) return 1;
        if(!a.saida_logistica && b.saida_logistica) return -1;
        // Com registro_id (portaria confirmou) primeiro
        if(a.registro_id && a.chegou && !(b.registro_id && b.chegou)) return -1;
        if(!(a.registro_id && a.chegou) && b.registro_id && b.chegou) return 1;
        // No patio antes de aguardando
        if(a.veiculo_no_patio && !b.veiculo_no_patio) return -1;
        if(!a.veiculo_no_patio && b.veiculo_no_patio) return 1;
        return 0;
      });

      // Montar lista lateral
      var listaHtml = '';
      var temAtivos = false, temConcluidos = false;

      // Motoristas ativos (a_caminho ou chegou, sem saida_logistica)
      motoristasOrdenados.forEach(function(d, idx){
        if(d.saida_logistica){ temConcluidos = true; return; }
        temAtivos = true;
        var st = getStatusInfo(d);
        var cor = cores[idx % cores.length];
        var tempo = d.atualizado_em ? new Date(d.atualizado_em).toLocaleString('pt-BR') : '---';
        var horaChegada = d.chegada_em ? new Date(d.chegada_em).toLocaleTimeString('pt-BR') : '';
        var placaJS = d.placa ? ('\'' + String(d.placa).replace(/\\/g, '\\\\').replace(/'/g, "\\'") + '\'') : 'null';
        var statusLabelPrefix = (st.emoji ? '&#x23F3; ' : '');
        listaHtml +=
          '<div class="motorista-card ' + st.css + '">' +
            '<div class="mc-topo" style="cursor:pointer" onclick="focarMapa(' + d.lat + ',' + d.lng + ')">' +
              '<div class="mc-cor" style="background:' + st.cor + '"></div>' +
              '<div class="mc-nome">' + esc(d.nome || 'Motorista') + '</div>' +
              '<div class="status-badge ' + st.badge + '">' + statusLabelPrefix + st.label + '</div>' +
            '</div>' +
            '<div class="mc-info">' +
              (d.placa ? '<div>Placa: <b>' + esc(d.placa) + '</b></div>' : '') +
              (d.empresa ? '<div>Empresa: ' + esc(d.empresa) + '</div>' : '') +
              (d.rua ? '<div class="mc-rua">&#x1F4CD; ' + esc(d.rua) + '</div>' : '') +
              '<div class="mc-tempo">' + (d.chegou && horaChegada ? 'Chegou as ' + horaChegada : 'Atualizado: ' + tempo) + '</div>' +
            '</div>' +
            (d.finalidade || d.cnh || d.modelo || d.nota || d.obs ?
              '<div class="mc-adicionais">' +
                (d.finalidade ? '<div><b>Finalidade:</b> ' + esc(d.finalidade) + '</div>' : '') +
                (d.cnh ? '<div><b>CNH:</b> ' + esc(d.cnh) + '</div>' : '') +
                (d.modelo ? '<div><b>Modelo:</b> ' + esc(d.modelo) + '</div>' : '') +
                (d.nota ? '<div><b>Nota/RT:</b> ' + esc(d.nota) + '</div>' : '') +
                (d.obs ? '<div><b>Info Adicionais:</b> ' + esc(d.obs) + '</div>' : '') +
              '</div>' : '') +
            '<div class="mc-acoes">' +
              (d.registro_id && d.chegou && !d.saida_logistica && !d.veiculo_no_patio ? '<button class="btn-patio-liberado" onclick="event.stopPropagation(); patioLiberado(' + placaJS + ')">&#x1F6E4;&#xFE0F; Patio Liberado</button>' : '') +
              (d.registro_id && d.chegou && !d.saida_logistica && d.veiculo_no_patio && !d.patio_liberado ? '<button class="btn-finalizado" onclick="event.stopPropagation(); finalizarVeiculo(' + placaJS + ')">&#x2705; Finalizado</button>' : '') +
              (d.registro_id && d.chegou && !d.saida_logistica && d.veiculo_no_patio && d.patio_liberado ? '<button class="btn-finalizado" disabled style="opacity:.5">&#x2705; Patio Finalizado</button>' : '') +
              (d.registro_id && d.chegou && !d.saida_logistica && !d.veiculo_no_patio ? '<button class="btn-finalizado" disabled style="opacity:.4" title="Libere o patio primeiro">&#x2705; Finalizado</button>' : '') +
              '<button class="btn-imprimir" onclick="event.stopPropagation(); imprimirMotorista(' + (d.motorista_id || 'null') + ')" title="Imprimir ficha">&#x1F5A8; Imprimir</button>' +
            '</div>' +
          '</div>';
      });

      // Separador: Concluidos
      if(temConcluidos && temAtivos){
        listaHtml += '<div class="separador">&#x2705; CONCLUIDAS (' + concluidoCount + ')</div>';
      }

      // Motoristas concluidos
      motoristas.forEach(function(d, idx){
        if(!d.saida_logistica) return;
        var st = getStatusInfo(d);
        var horaSaida = d.saida_em ? new Date(d.saida_em).toLocaleTimeString('pt-BR') : '';
        var horaChegada = d.chegada_em ? new Date(d.chegada_em).toLocaleTimeString('pt-BR') : '';
        listaHtml +=
          '<div class="motorista-card concluido-card' + (d.lat ? '" onclick="focarMapa(' + d.lat + ',' + d.lng + ')"' : '"') + '>' +
            '<div class="mc-topo">' +
              '<div class="mc-cor" style="background:' + st.cor + '"></div>' +
              '<div class="mc-nome">' + esc(d.nome || 'Motorista') + '</div>' +
              '<div class="status-badge concluido">' + st.label + '</div>' +
            '</div>' +
            '<div class="mc-info">' +
              (d.placa ? '<div>Placa: <b>' + esc(d.placa) + '</b></div>' : '') +
              (d.empresa ? '<div>Empresa: ' + esc(d.empresa) + '</div>' : '') +
              (horaChegada ? '<div>Chegou: ' + horaChegada + '</div>' : '') +
              (horaSaida ? '<div><b>Saida: ' + horaSaida + '</b></div>' : '') +
              '<div class="mc-tempo">' + (d.rua ? '&#x1F4CD; ' + esc(d.rua) : '') + '</div>' +
            '</div>' +
            (d.finalidade || d.cnh || d.modelo || d.nota || d.obs ?
              '<div class="mc-adicionais">' +
                (d.finalidade ? '<div><b>Finalidade:</b> ' + esc(d.finalidade) + '</div>' : '') +
                (d.cnh ? '<div><b>CNH:</b> ' + esc(d.cnh) + '</div>' : '') +
                (d.modelo ? '<div><b>Modelo:</b> ' + esc(d.modelo) + '</div>' : '') +
                (d.nota ? '<div><b>Nota/RT:</b> ' + esc(d.nota) + '</div>' : '') +
                (d.obs ? '<div><b>Info Adicionais:</b> ' + esc(d.obs) + '</div>' : '') +
              '</div>' : '') +
          '</div>';
      });

      // Separador: Pre-registros
      if(motoristas.length > 0 && preRegistros.length > 0){
        listaHtml += '<div class="separador">&#x1F4E6; PRE-REGISTROS PENDENTES (' + preRegistros.length + ')</div>';
      }

      // Pre-registros
      preRegistros.forEach(function(pr){
        listaHtml +=
          '<div class="pr-card">' +
            '<div class="pr-topo">' +
              '<div style="font-size:16px">&#x1F69A;</div>' +
              '<div class="pr-motorista">' + esc(pr.motorista || '---') + '</div>' +
            '</div>' +
            '<div class="pr-info">' +
              '<b>Placa:</b> ' + esc(pr.placa || '---') +
              (pr.modelo ? ' | <b>Modelo:</b> ' + esc(pr.modelo) : '') +
              (pr.finalidade ? ' | <b>Tipo:</b> ' + esc(pr.finalidade) : '') +
              (pr.empresa ? '<br><b>Empresa:</b> ' + esc(pr.empresa) : '') +
              (pr.nota ? '<br><b>Nota:</b> ' + esc(pr.nota) : '') +
              (pr.obs ? '<br><b>Obs:</b> ' + esc(pr.obs) : '') +
            '</div>' +
          '</div>';
      });

      // Separador: Check-ins de Transportadora
      if(checkinsQR.length > 0){
        listaHtml += '<div class="separador">&#x1F4E8; CHECK-INS DA TRANSPORTADORA (' + checkinsQR.length + ')</div>';
      }

      // Check-ins QR
      checkinsQR.forEach(function(c, idx){
        var statusLabel = c.status_checkin === 'em_transito' ? 'Em Trânsito' : c.status_checkin === 'confirmado' ? 'Confirmado' : 'Aguardando';
        var statusIcon = c.status_checkin === 'em_transito' ? '&#x1F69A;' : c.status_checkin === 'confirmado' ? '&#x2705;' : '&#x1F4CD;';
        var tipoLabel = c.tipo_checkin === 'partida' ? '&#x1F69A; Partida' : '&#x1F4CD; Chegada';
        listaHtml +=
          '<div class="checkin-card" onclick="verDetalhesCheckin(' + idx + ')">' +
            '<div class="cc-topo">' +
              '<div style="font-size:14px">' + statusIcon + '</div>' +
              '<div class="cc-motorista">' + esc(c.motorista || 'Motorista') + '</div>' +
              '<div class="cc-status ' + (c.status_checkin || '') + '">' + statusLabel + '</div>' +
            '</div>' +
            '<div class="cc-info">' +
              (c.placa ? '<div>Placa: <b>' + esc(c.placa) + '</b></div>' : '') +
              (c.empresa ? '<div>Empresa: ' + esc(c.empresa) + '</div>' : '') +
              (c.descricao_material ? '<div>Material: ' + esc(c.descricao_material) + '</div>' : '') +
              '<div style="display:flex;align-items:center;gap:8px;margin-top:2px">' +
                '<span>' + tipoLabel + '</span>' +
                '<span style="color:#9aa4ad">' + (c.criado_em ? new Date(c.criado_em).toLocaleString('pt-BR') : '---') + '</span>' +
              '</div>' +
            '</div>' +
          '</div>';
      });

      if(motoristas.length === 0 && preRegistros.length === 0 && checkinsQR.length === 0){
        listaHtml = '<div style="text-align:center;color:#9aa4ad;font-size:13px;padding:20px">Nenhuma movimentacao no momento</div>';
      }

      document.getElementById('listaContainer').innerHTML = listaHtml;

      // Atualizar mapa (so mostra ativos com coordenadas)
      if(!mapa) return;
      marcadores.forEach(function(m){ mapa.removeLayer(m); });
      marcadores = [];
      var bounds = [];
      var markerIdx = 0;
      motoristas.forEach(function(d, idx){
        if(d.lat == null || d.lng == null) return;
        // Concluidos aparecem no mapa com estilo diferente
        var st = getStatusInfo(d);
        var cor = cores[markerIdx % cores.length];
        markerIdx++;

        var pinBg = st.cor;
        var icone = L.divIcon({
          className: '',
          html: '<div style="position:relative;width:38px;height:38px">' +
            '<div style="width:38px;height:38px;background:' + pinBg + ';border:3px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 3px 8px rgba(0,0,0,.3)"></div>' +
            '<div style="position:absolute;top:7px;left:50%;transform:translateX(-50%) rotate(45deg);color:#fff;font-size:13px;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.4)">' + (d.saida_logistica ? '&#x2714;' : (idx + 1)) + '</div>' +
          '</div>',
          iconSize: [38, 38], iconAnchor: [19, 38], popupAnchor: [0, -38]
        });
        var marker = L.marker([d.lat, d.lng], { icon: icone }).addTo(mapa);
        var tempo = d.atualizado_em ? new Date(d.atualizado_em).toLocaleString('pt-BR') : '---';
        var statusPopup = '';
        if(d.saida_logistica){
          var horaSaida = d.saida_em ? ' as ' + new Date(d.saida_em).toLocaleTimeString('pt-BR') : '';
          statusPopup = '<span style="color:#4caf50;font-weight:700">&#x2705; ' + st.label + '</span>' + horaSaida;
        } else {
          var horaChegada = d.chegada_em ? ' as ' + new Date(d.chegada_em).toLocaleTimeString('pt-BR') : '';
          statusPopup = d.a_caminho
            ? '<span style="color:#ff9800;font-weight:700">&#x1F69A; A caminho</span>'
            : '<span style="color:#2196F3;font-weight:700">&#x1F4CD; Chegou</span>' + horaChegada;
        }
        marker.bindPopup(
          '<div style="min-width:200px">' +
            '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">' +
              '<div style="width:14px;height:14px;border-radius:50%;background:' + pinBg + ';border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.2)"></div>' +
              '<b style="font-size:14px">' + esc(d.nome || 'Motorista') + '</b>' +
            '</div>' +
            statusPopup + '<br>' +
            (d.placa ? 'Placa: <b>' + esc(d.placa) + '</b><br>' : '') +
            (d.empresa ? 'Empresa: ' + esc(d.empresa) + '<br>' : '') +
            (d.rua ? '<div style="margin-top:6px;padding-top:6px;border-top:1px solid #e0e0e0;color:#2a6f7e">&#x1F4CD; ' + esc(d.rua) + '</div>' : '') +
            '<div style="margin-top:4px;font-size:11px;color:#9aa4ad">Atualizado: ' + tempo + '</div>' +
          '</div>'
        );

        // Label
        var labelText = esc(d.nome || 'Motorista');
        if(d.rua) labelText += ' &middot; ' + esc(d.rua);
        if(d.saida_logistica) labelText = '&#x2705; ' + labelText;
        var labelIcon = L.divIcon({
          className: '',
          html: '<div style="background:#fff;color:#333;font-size:11px;font-weight:600;padding:3px 8px;border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.2);white-space:nowrap;border:1px solid #ddd;max-width:240px;overflow:hidden;text-overflow:ellipsis"><span style="color:' + pinBg + ';font-weight:800">#' + (d.saida_logistica ? '&#x2714;' : (idx+1)) + '</span> ' + labelText + '</div>',
          iconSize: [240, 24], iconAnchor: [120, 44]
        });
        var label = L.marker([d.lat, d.lng], { icon: labelIcon, interactive: false }).addTo(mapa);
        marcadores.push(label);
        marcadores.push(marker);
        bounds.push([d.lat, d.lng]);
      });
      if(bounds.length > 0){
        if(bounds.length === 1){ mapa.setView(bounds[0], 15); }
        else { mapa.fitBounds(bounds, { padding: [40, 40], maxZoom: 16 }); }
      }
    })
    .catch(function(err){ console.error('Erro ao carregar dados:', err); });
}

function focarMapa(lat, lng){
  if(mapa){ mapa.setView([lat, lng], 16, { animate: true }); }
}

function esc(s){
  if(!s) return '';
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// === Modal de detalhes check-in QR ===
function verDetalhesCheckin(idx){
  var d = checkinsCache[idx];
  if(!d) return;
  var modal = document.getElementById('modalOverlay');
  var body = document.getElementById('modalBody');

  var linhas = [
    { label: 'Tipo', valor: d.tipo_checkin === 'partida' ? '🚛 Partida (Em trânsito)' : '📍 Chegada (Na portaria)' },
    { label: 'Status', valor: d.status_checkin === 'em_transito' ? '🚀 Em Trânsito' : d.status_checkin === 'confirmado' ? '✅ Confirmado' : '📍 Aguardando na Portaria' }
  ];
  if(d.motorista) linhas.push({ label: 'Motorista', valor: d.motorista });
  if(d.cnh) linhas.push({ label: 'CNH', valor: d.cnh });
  if(d.telefone_motorista) linhas.push({ label: 'Telefone', valor: d.telefone_motorista });
  if(d.placa) linhas.push({ label: 'Placa', valor: d.placa });
  if(d.modelo) linhas.push({ label: 'Modelo', valor: d.modelo });
  if(d.empresa) linhas.push({ label: 'Empresa', valor: d.empresa });
  if(d.finalidade) linhas.push({ label: 'Finalidade', valor: d.finalidade });
  if(d.nota) linhas.push({ label: 'Nota Fiscal', valor: d.nota });
  if(d.descricao_material) linhas.push({ label: 'Material', valor: d.descricao_material });
  if(d.quantidade_peso) linhas.push({ label: 'Qtd/Peso', valor: d.quantidade_peso });
  if(d.nome_recebedor) linhas.push({ label: 'Recebedor', valor: d.nome_recebedor });
  if(d.data_previsao) linhas.push({ label: 'Previsão', valor: new Date(d.data_previsao + 'T00:00:00').toLocaleDateString('pt-BR') });
  if(d.criado_em) linhas.push({ label: 'Check-in em', valor: new Date(d.criado_em).toLocaleString('pt-BR') });
  if(d.obs) linhas.push({ label: 'Observação', valor: d.obs });

  body.innerHTML = linhas.map(function(l){
    return '<div class="modal-linha"><div class="modal-label">' + esc(l.label) + '</div><div class="modal-valor">' + esc(l.valor) + '</div></div>';
  }).join('');
  modal.classList.add('mostrar');
}

function fecharModal(){
  document.getElementById('modalOverlay').classList.remove('mostrar');
}

// Fechar modal clicando fora
document.getElementById('modalOverlay').addEventListener('click', function(e){
  if(e.target === this) fecharModal();
});

// Fechar modal com ESC
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') fecharModal();
});

// === ACOES DE LOGISTICA ===

// === PATIO LIBERADO (operador confirma veiculo no patio, avisa portaria) ===
async function patioLiberado(placa){
  if(!confirm('Confirmar liberacao do patio para o veiculo placa ' + placa + '? A portaria sera notificada.')) return;
  try {
    var res = await fetch(API + '/api/logistica/' + encodeURIComponent(TOKEN) + '/patio-liberado', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ placa: placa })
    });
    if(!res.ok){
      var err = await res.json();
      alert(err.erro || 'Erro ao liberar patio');
      return;
    }
    carregarDados();
  } catch(e){
    alert('Erro de conexao: ' + e.message);
  }
}

// === FINALIZAR VEICULO (descarga concluida, patio finalizado + notificar portaria) ===
async function finalizarVeiculo(placa){
  if(!confirm('Confirmar finalizacao da descarga? A portaria sera notificada que o patio esta finalizado.')) return;
  try {
    var res = await fetch(API + '/api/logistica/' + encodeURIComponent(TOKEN) + '/finalizar-veiculo', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ placa: placa })
    });
    if(!res.ok){
      var err = await res.json();
      alert(err.erro || 'Erro ao finalizar');
      return;
    }
    carregarDados();
  } catch(e){
    alert('Erro de conexao: ' + e.message);
  }
}

// === IMPRIMIR FICHA DO MOTORISTA ===
var motoristasCache = [];
// Salvar cache de motoristas para impressao
// (usado dentro de carregarDados - ja atualiza a lista)

  if(!motoristaId){ alert('Motorista nao identificado'); return; }

  fetch(API + '/api/logistica/' + encodeURIComponent(TOKEN))
    .then(function(res){ return res.json(); })
    .then(function(data){

      var m = data.motoristas.find(function(d){ return d.motorista_id === motoristaId; });

      var st = getStatusInfo(m);
      var horaChegada = m.chegada_em ? new Date(m.chegada_em).toLocaleTimeString('pt-BR') : '---';
      var horaSaida = m.saida_em ? new Date(m.saida_em).toLocaleTimeString('pt-BR') : '';
      var dataHora = m.chegada_em ? new Date(m.chegada_em).toLocaleString('pt-BR') : new Date().toLocaleString('pt-BR');

      var win = window.open('', '_blank', 'width=400,height=600');
      win.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Ficha Motorista</title>' +
        '<style>' +

        '.header{text-align:center;border-bottom:2px solid #1a1a2e;padding-bottom:12px;margin-bottom:16px}' +
        '.header h1{font-size:16px;color:#1a1a2e;margin-bottom:4px}' +
        '.header p{font-size:11px;color:#666}' +
        '.status{text-align:center;padding:8px;border-radius:8px;margin-bottom:16px;font-size:14px;font-weight:700;color:#fff;background:' + st.cor + '}' +
        '.campo{display:flex;padding:8px 0;border-bottom:1px solid #eee;font-size:12px}' +
        '.campo .label{min-width:100px;color:#666;font-weight:600}' +
        '.campo .valor{flex:1;color:#1a1a2e;font-weight:700}' +
        '.footer{text-align:center;margin-top:20px;padding-top:12px;border-top:1px solid #ddd;font-size:9px;color:#999}' +
        '@media print{body{padding:10px}.header{border-bottom:2px solid #000}}' +
        '</style></head><body>' +
        '<div class="header"><h1>DSRH - Controle de Portaria</h1><p>' + esc(EMPRESA) + '</p></div>' +
        '<div class="status">' + st.label + '</div>' +
        '<div class="campo"><div class="label">Motorista</div><div class="valor">' + esc(m.nome || '---') + '</div></div>' +
        '<div class="campo"><div class="label">Placa</div><div class="valor">' + esc(m.placa || '---') + '</div></div>' +

}

// === TOAST NOTIFICATIONS ===
function tocarSininhoLogistica(){
  try{
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var notas = [1200, 1000, 800, 650];
    var tempoNota = 0.5;
    notas.forEach(function(freq, i){
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.type = 'sine';
      var inicio = ctx.currentTime + (i * tempoNota);
      gain.gain.setValueAtTime(0, inicio);
      gain.gain.linearRampToValueAtTime(0.2, inicio + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, inicio + tempoNota * 0.95);
      osc.start(inicio);
      osc.stop(inicio + tempoNota);
    });
  }catch(e){}
}

var notifsAnterioresLog = 0;

function mostrarToastLog(titulo, descricao, tipo){
  var container = document.getElementById('toastContainerLog');
  if(!container) return;
  var toast = document.createElement('div');
  var bg = '#fff', border = '#e3e7eb', corTitulo = '#1a1a2e', icone = '🔔';
  if(tipo === 'entrada'){ bg = '#e9f1fa'; border = '#2f6fb0'; icone = '🚛'; }
  else if(tipo === 'patio_liberado'){ bg = '#fff8e1'; border = '#e08a1e'; icone = '&#x2705;'; }
  else if(tipo === 'veiculo_no_patio'){ bg = '#fff8e1'; border = '#e08a1e'; icone = '&#x1F6E4;&#xFE0F;'; }
  toast.style.cssText = 'background:' + bg + ';border-left:4px solid ' + border + ';border-radius:10px;padding:14px 16px;box-shadow:0 4px 20px rgba(0,0,0,.15);display:flex;align-items:flex-start;gap:12px;animation:toastSlideIn .3s ease;max-width:380px';
  var hora = new Date().toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'});
  toast.innerHTML = '<div style="font-size:24px;flex-shrink:0">' + icone + '</div>' +
    '<div style="flex:1;min-width:0">' +
      '<div style="font-size:13px;font-weight:700;color:' + corTitulo + '">' + titulo + '</div>' +
      '<div style="font-size:12px;color:#5b6672;margin-top:3px;word-wrap:break-word">' + descricao + '</div>' +
      '<div style="font-size:10px;color:#999;margin-top:4px">' + hora + '</div>' +
    '</div>' +
    '<button onclick="this.parentElement.remove()" style="background:none;border:none;font-size:18px;color:#999;cursor:pointer;padding:0;flex-shrink:0" aria-label="Fechar">&times;</button>';
  container.appendChild(toast);
  tocarSininhoLogistica();
  setTimeout(function(){ if(toast.parentElement) toast.remove(); }, 10000);
}

async function verificarNotificacoesLog(){
  if(!TOKEN) return;
  try {
    var res = await fetch(API + '/api/logistica/' + encodeURIComponent(TOKEN) + '/notificacoes');
    if(!res.ok) return;
    var notifs = await res.json();
    var total = notifs.length;
    if(total > notifsAnterioresLog){
      var novas = notifs.slice(0, total - notifsAnterioresLog);
      novas.forEach(function(n){
        mostrarToastLog(n.titulo || 'Notificacao', n.descricao || '', n.tipo);
      });
    }
    notifsAnterioresLog = total;
    // Marcar como lidas
    if(total > 0){
      fetch(API + '/api/logistica/' + encodeURIComponent(TOKEN) + '/notificacoes/ler-todas', { method: 'PUT' }).catch(function(){});
    }
  } catch(e){}
}

iniciarMapa();
carregarDados();
setInterval(carregarDados, 10000);
verificarNotificacoesLog();
setInterval(verificarNotificacoesLog, 5000);
